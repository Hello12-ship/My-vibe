<meta charset="UTF-8">

<title>Akash Vibes Premium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

:root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-sub: #868e96;
    --accent: #4361ee;
    --accent-glow: rgba(67, 97, 238, 0.3);
    --border: #e9ecef;
    --ease-elastic: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
}

body.dark {
    --bg: #0f1115;
    --surface: #181a1f;
    --text: #ffffff;
    --text-sub: #a0a0a0;
    --accent: #4cc9f0;
    --accent-glow: rgba(76, 201, 240, 0.3);
    --border: #2a2d35;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

body {
    margin: 0;
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.4s var(--ease-smooth), color 0.4s;
}

/* --- HEADER --- */
header {
    padding: 16px 20px;
    background: var(--surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 50;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
}
.brand { font-weight: 700; font-size: 1.4rem; letter-spacing: -0.5px; }
.brand span { color: var(--accent); }

.badge-count {
    font-size: 0.75rem;
    background: var(--accent);
    color: var(--surface);
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 700;
    margin-left: 10px;
    box-shadow: 0 4px 10px var(--accent-glow);
}

.theme-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    cursor: pointer;
    transition: transform 0.2s var(--ease-elastic);
}
.theme-btn:active { transform: scale(0.85); }

/* --- TABS --- */
.tabs {
    display: flex;
    background: var(--surface);
    padding: 5px;
    margin: 10px 15px;
    border-radius: 16px;
    border: 1px solid var(--border);
}
.tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: var(--text-sub);
    font-weight: 600;
    font-family: inherit;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s var(--ease-smooth);
}
.tab-btn.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 15px var(--accent-glow);
}

/* --- CONTENT AREA --- */
.view-container {
    flex: 1;
    position: relative;
    overflow: hidden; /* For sliding effects */
}

.content-area {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    padding: 0 15px 100px 15px;
    overflow-y: auto;
    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
    transition: all 0.4s var(--ease-smooth);
}

.content-area.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    z-index: 10;
}

.search-box {
    width: 100%;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    margin: 10px 0 20px 0;
    outline: none;
    font-family: inherit;
    transition: 0.3s;
    font-size: 0.95rem;
}
.search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

/* --- CARDS --- */
.card {
    background: var(--surface);
    padding: 12px;
    border-radius: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.2s var(--ease-elastic), background 0.2s;
    /* Stagger Animation Default */
    opacity: 0; animation: slideInUp 0.5s forwards;
}
@keyframes slideInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

.card:active { transform: scale(0.95); background: var(--bg); }

.card-info { flex: 1; padding: 0 12px; overflow: hidden; }
.c-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-meta { font-size: 0.8rem; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
.tag { background: rgba(128,128,128,0.1); padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; }

.play-icon {
    width: 36px; height: 36px;
    background: var(--bg);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    font-size: 0.9rem;
}

/* --- PLAYER (Full Screen) --- */
#player {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg);
    z-index: 100;
    display: flex;
    flex-direction: column;
    
    /* Animation State: Hidden by default via Transform */
    transform: translateY(110%);
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
}

#player.open {
    transform: translateY(0);
}

.p-nav { padding: 25px 20px; display: flex; justify-content: space-between; align-items: center; }
.close-btn { 
    font-size: 1.8rem; background: transparent; border: none; 
    color: var(--text); cursor: pointer; 
    transition: 0.2s var(--ease-elastic);
}
.close-btn:active { transform: scale(0.7) rotate(90deg); }

.p-body { 
    flex: 1; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; 
    padding: 0 30px 40px 30px; text-align: center; 
}

/* VINYL ANIMATION */
.vinyl-wrap {
    width: 260px; height: 260px;
    border-radius: 50%;
    background: #101010;
    border: 6px solid var(--surface);
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 40px;
    position: relative;
    
    /* Spin Logic */
    animation: spin 8s linear infinite;
    animation-play-state: paused;
}
.playing .vinyl-wrap { animation-play-state: running; }

.vinyl-center {
    width: 100px; height: 100px;
    background: linear-gradient(135deg, var(--accent), #7209b7);
    border-radius: 50%;
    border: 4px solid #fff;
    position: relative;
}
/* Shine effect on vinyl */
.vinyl-wrap::after {
    content: ''; position: absolute; top:0; left:0; width:100%; height:100%;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(255,255,255,0.05) 100%);
    pointer-events: none;
}
@keyframes spin { 100% { transform: rotate(360deg); } }

.song-title-lg { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; line-height: 1.2; }
.song-meta-lg { font-size: 1rem; color: var(--accent); font-weight: 600; margin-bottom: 30px; }

/* CONTROLS */
audio { 
    width: 100%; margin-bottom: 25px; 
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
}

.controls-row {
    display: flex; gap: 15px; width: 100%;
}

.btn-big {
    flex: 1;
    padding: 16px;
    border-radius: 18px;
    border: none;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 0.2s var(--ease-elastic);
}
.btn-big:active { transform: scale(0.9); }

.btn-fav { background: var(--surface); color: var(--text); border: 2px solid var(--border); }
.btn-fav.liked { color: #ff0054; border-color: #ff0054; background: rgba(255,0,84,0.05); }

.btn-down { background: var(--text); color: var(--bg); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }

/* TOAST */
#toast {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.85); color: #fff;
    padding: 12px 24px; border-radius: 50px;
    font-size: 0.9rem; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: 0.4s var(--ease-elastic);
    backdrop-filter: blur(4px);
    z-index: 200;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

</style>

// REFERENCES
const listContainer = document.getElementById('listContainer');
const offlineContainer = document.getElementById('offlineContainer');
const player = document.getElementById('player');
const audio = document.getElementById('audio');
const toast = document.getElementById('toast');
const totalCounter = document.getElementById('totalCounter');

// Player Data
const pTitle = document.getElementById('pTitle');
const pMeta = document.getElementById('pMeta');
const likeBtn = document.getElementById('likeBtn');
const likeCountEl = document.getElementById('likeCount');
const downloadBtn = document.getElementById('downloadBtn');

// OFFLINE DB SETUP
const DB_NAME = "AkashPremiumDB";
const STORE = "tracks";
let dbInstance;

function initDB() {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = (e) => {
        const d = e.target.result;
        if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, {keyPath: "title"});
    };
    r.onsuccess = (e) => {
        dbInstance = e.target.result;
        renderOffline();
    }
}
initDB();

async function saveOffline(song) {
    showToast("Downloading... ⏳");
    try {
        const resp = await fetch(song.file);
        const blob = await resp.blob();
        const tx = dbInstance.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put({...song, blob: blob});
        tx.oncomplete = () => {
            showToast("Saved Offline! ✅");
            downloadBtn.innerText = "Saved";
            renderOffline();
        };
    } catch(e) {
        showToast("Error saving offline. ❌");
    }
}

// RENDERERS
function renderLibrary(query="") {
    listContainer.innerHTML = "";
    const term = query.toLowerCase();
    let count = 0;

    songs.forEach((s, i) => {
        if(s.title.toLowerCase().includes(term) || s.movie.toLowerCase().includes(term)) {
            count++;
            const el = document.createElement('div');
            el.className = 'card';
            // Stagger animation delay based on index
            el.style.animationDelay = `${i * 0.03}s`; 
            
            el.innerHTML = `
                <div class="card-info">
                    <div class="c-title">${s.title}</div>
                    <div class="c-meta"><span class="tag">${s.movie}</span> ${s.artist.split(',')[0]}</div>
                </div>
                <div class="play-icon">▶</div>
            `;
            el.onclick = () => openPlayer(s, false);
            listContainer.appendChild(el);
        }
    });
    totalCounter.innerText = count;
}

function renderOffline() {
    if(!dbInstance) return;
    const tx = dbInstance.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => {
        const data = req.result;
        offlineContainer.innerHTML = "";
        if(data.length === 0) return;
        
        data.forEach((s) => {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = `
                <div class="card-info">
                    <div class="c-title">${s.title}</div>
                    <div class="c-meta"><span class="tag" style="color:#2ec4b6">Offline</span> ${s.artist}</div>
                </div>
                <div class="play-icon">▶</div>
            `;
            el.onclick = () => openPlayer(s, true);
            offlineContainer.appendChild(el);
        });
    }
}

// PLAYER LOGIC
window.openPlayer = function(song, isOffline) {
    pTitle.innerText = song.title;
    pMeta.innerText = `${song.movie} • ${song.artist}`;
    
    player.classList.add('open'); // Trigger Slide Up
    player.classList.add('playing'); // Trigger Vinyl Spin

    if(isOffline && song.blob) {
        audio.src = URL.createObjectURL(song.blob);
        likeBtn.style.display = "none";
        downloadBtn.style.display = "none";
    } else {
        audio.src = song.file;
        likeBtn.style.display = "flex";
        downloadBtn.style.display = "flex";
        downloadBtn.innerText = "Download";
        
        // Firebase Likes
        const id = song.title.replace(/[.#$[\]]/g, '_').replace(/\s+/g, '_');
        const rRef = ref(db, 'likes/'+id);
        
        onValue(rRef, (snap) => {
            likeCountEl.innerText = snap.val() || 0;
        });
        
        // Clean click listener
        const newBtn = likeBtn.cloneNode(true);
        likeBtn.parentNode.replaceChild(newBtn, likeBtn);
        document.getElementById('likeBtn').onclick = function() {
            runTransaction(rRef, (c) => (c||0)+1);
            this.classList.add('liked');
            showToast("Liked! ❤️");
        }
        
        // Download
        downloadBtn.onclick = () => {
            // Browser Download
            const a = document.createElement('a');
            a.href = song.file;
            a.download = song.file;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            // App Save
            saveOffline(song);
        }
    }
    audio.play();
}

window.closePlayer = function() {
    player.classList.remove('open');
    player.classList.remove('playing');
    setTimeout(() => {
        audio.pause();
    }, 400); // Wait for slide down
}

// UTILS
window.toggleTheme = () => document.body.classList.toggle('dark');

window.switchTab = (tab) => {
    // Buttons
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    // Areas
    const library = document.getElementById('library');
    const downloads = document.getElementById('downloads');
    
    library.classList.remove('active');
    downloads.classList.remove('active');
    
    if(tab === 'library') {
        document.querySelector("button[onclick=\"switchTab('library')\"]").classList.add('active');
        library.classList.add('active');
    } else {
        document.querySelector("button[onclick=\"switchTab('downloads')\"]").classList.add('active');
        downloads.classList.add('active');
        renderOffline();
    }
}

function showToast(msg) {
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

// Init
renderLibrary();
document.getElementById('searchInput').addEventListener('input', (e) => renderLibrary(e.target.value));
audio.addEventListener('ended', () => {
    const r = Math.floor(Math.random()*songs.length);
    openPlayer(songs[r], false);
});
